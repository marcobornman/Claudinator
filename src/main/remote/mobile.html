<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0d1117" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Claudinator" />
<title>Claudinator Remote</title>
<!-- The manifest link is injected by script so its URL carries the access
     token — the tokenised manifest gives the installed app a start_url that
     can authenticate (see /manifest.webmanifest on the server). -->
<link rel="apple-touch-icon" href="/assets/icon.png" />
<link rel="stylesheet" href="/assets/xterm.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Stop iOS Safari inflating glyphs inside the zoomed terminal — without
     this the fitted terminal renders squashed (tall glyphs in narrow cells). */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { height: 100%; }
  body {
    background: #0d1117; color: #e6edf3;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }
  /* While the terminal overlay is open the board must not scroll underneath
     it. iOS chains any touch scroll that the overlay doesn't consume (header,
     input bar, terminal-at-bottom overscroll) into the page behind a fixed
     overlay — overflow:hidden alone doesn't stop that, position:fixed does.
     The board's scroll position is saved/restored around the lock in JS. */
  body.sessOpen { position: fixed; inset: 0; width: 100%; overflow: hidden; }

  /* ---- Board view ---- */
  /* Top safe-area padding keeps content clear of the iOS status bar when the
     page is installed as a home-screen app (black-translucent + viewport-fit=cover
     make it render underneath the clock/battery). Zero in a normal browser tab. */
  #board { padding: calc(14px + env(safe-area-inset-top)) 14px 40px; max-width: 560px; margin: 0 auto; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 4px 2px 14px; }
  .topbar h1 { font-size: 16px; font-weight: 600; flex: 1; }
  .conn { width: 8px; height: 8px; border-radius: 50%; background: #f85149; }
  .conn.ok { background: #3fb950; }
  .colTitle {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
    color: #9198a1; margin: 16px 2px 8px; display: flex; gap: 6px; align-items: center;
    padding: 4px 2px; user-select: none; -webkit-user-select: none;
  }
  .colTitle:active { opacity: 0.6; }
  .colTitle .n { color: #59636e; font-weight: 500; }
  .colChev { color: #59636e; font-size: 9px; width: 11px; text-align: center; }
  .colAlert {
    width: 7px; height: 7px; border-radius: 50%; background: #e8833a;
    animation: pulse 1.2s ease-in-out infinite; margin-left: 2px;
  }
  .card {
    background: #161b22; border: 1px solid #21262d; border-radius: 10px;
    padding: 12px 14px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 10px;
  }
  .card.tappable:active { background: #1c2129; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; background: #59636e; }
  .dot.running { background: #58a6ff; }
  .dot.waiting { background: #3fb950; }
  .dot.decision { background: #e8833a; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .cardBody { flex: 1; min-width: 0; }
  .cardTitle { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cardMeta { font-size: 11px; color: #9198a1; margin-top: 3px; display: flex; gap: 8px; }
  .chev { color: #59636e; font-size: 16px; }
  .empty { color: #59636e; font-size: 13px; text-align: center; padding: 40px 0; }

  /* ---- Terminal view ---- */
  #session { position: fixed; inset: 0; background: #0d1117; display: none; flex-direction: column; }
  #session.open { display: flex; }
  .sessHead {
    display: flex; align-items: center; gap: 10px;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    border-bottom: 1px solid #21262d; flex-shrink: 0;
  }
  .back {
    background: #21262d; border: none; color: #e6edf3; border-radius: 8px;
    padding: 8px 14px; font-size: 13px;
  }
  .sessTitle { font-size: 14px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Vertical scrolling is done by xterm itself: its touch handlers set the
     viewport's scrollTop programmatically. -webkit-overflow-scrolling:touch
     must NOT be set on the viewport — iOS ignores programmatic scrollTop on
     momentum-scrolled layers while a finger is down, which made the terminal
     unscrollable. The wrap only pans horizontally when viewing at 1:1. */
  #termWrap { flex: 1; overflow-x: auto; overflow-y: hidden; padding: 6px 0 0 6px; overscroll-behavior: contain; }
  #term { width: max-content; }
  .xterm .xterm-viewport { overscroll-behavior: contain; }
  .stoppedNote {
    display: none; padding: 8px 14px; background: #3d1d1f; color: #ffa198; font-size: 12px;
  }
  .stoppedNote.show { display: block; }

  /* ---- Copy view: buffer text as plain selectable text ---- */
  /* xterm's selection is mouse-driven and its rendered rows can't be
     long-press selected on iOS, so copying goes through this overlay where
     the native selection callout (with Copy) just works. */
  #copyView { position: fixed; inset: 0; background: #0d1117; z-index: 10; display: none; flex-direction: column; }
  #copyView.open { display: flex; }
  .copyHint { font-size: 12px; color: #9198a1; flex: 1; }
  #copyText {
    flex: 1; overflow: auto; margin: 0; padding: 10px 14px calc(16px + env(safe-area-inset-bottom));
    font: 11px/1.4 Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-all;
    color: #e6edf3; -webkit-user-select: text; user-select: text;
    overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  }

  /* ---- Input bar ---- */
  .inputBar { flex-shrink: 0; border-top: 1px solid #21262d; background: #161b22; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); }
  .quickRow { display: flex; gap: 6px; margin-bottom: 6px; }
  .qk {
    background: #21262d; border: 1px solid #30363d; color: #e6edf3;
    border-radius: 8px; padding: 9px 0; font-size: 13px; flex: 1; min-width: 0;
    text-align: center;
  }
  .qk:active { background: #30363d; }
  .textRow { display: flex; gap: 8px; }
  #msg {
    flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 8px;
    color: #e6edf3; padding: 10px 12px; font-size: 16px; outline: none; min-width: 0;
  }
  #sendBtn {
    background: #1f6feb; border: none; color: #fff; border-radius: 8px;
    padding: 0 18px; font-size: 14px; font-weight: 600;
  }
  #sendBtn:active { opacity: 0.8; }

  #authErr { display: none; padding: calc(60px + env(safe-area-inset-top)) 24px 60px; text-align: center; color: #ffa198; font-size: 14px; }
  #authErr input {
    display: block; width: 100%; margin: 16px 0 8px; background: #0d1117;
    border: 1px solid #30363d; border-radius: 8px; color: #e6edf3;
    padding: 10px 12px; font-size: 16px; outline: none;
  }
  #authErr button {
    background: #1f6feb; border: none; color: #fff; border-radius: 8px;
    padding: 10px 18px; font-size: 14px; font-weight: 600;
  }
</style>
</head>
<body>
  <div id="authErr">
    Unauthorized — rescan the QR code from Settings → Remote on your PC,
    or paste the pairing link below.
    <input id="tokenIn" type="text" autocomplete="off" autocapitalize="off" placeholder="Paste pairing link or token" />
    <button id="tokenGo">Connect</button>
  </div>

  <div id="board">
    <div class="topbar">
      <h1>Claudinator</h1>
      <div class="conn" id="conn"></div>
    </div>
    <div id="cols"></div>
  </div>

  <div id="session">
    <div class="sessHead">
      <button class="back" id="backBtn">‹ Board</button>
      <div class="sessTitle" id="sessTitle"></div>
      <button class="back" id="copyBtn" title="Select and copy terminal text">⧉</button>
      <button class="back" id="fitBtn" title="Toggle fit-to-width / actual size">1:1</button>
      <div class="dot" id="sessDot"></div>
    </div>
    <div class="stoppedNote" id="stoppedNote">Session stopped.</div>
    <div id="termWrap"><div id="term"></div></div>
    <div id="copyView">
      <div class="sessHead">
        <button class="back" id="copyDone">‹ Back</button>
        <div class="copyHint">Press and hold to select, then Copy</div>
      </div>
      <pre id="copyText"></pre>
    </div>
    <div class="inputBar">
      <div class="quickRow">
        <button class="qk" data-k="&#27;">Esc</button>
        <button class="qk" data-k="&#27;[Z">⇧Tab</button>
        <button class="qk" data-k="&#27;[A">↑</button>
        <button class="qk" data-k="&#27;[B">↓</button>
        <button class="qk" data-k="&#13;">Enter</button>
      </div>
      <div class="quickRow" style="margin-bottom: 8px;">
        <button class="qk" data-k="1">1</button>
        <button class="qk" data-k="2">2</button>
        <button class="qk" data-k="3">3</button>
        <button class="qk" data-k="y">y</button>
        <button class="qk" data-k="n">n</button>
        <button class="qk" data-k="&#127;" id="bsBtn">⌫</button>
      </div>
      <div class="textRow">
        <button class="qk" id="imgBtn" style="flex: 0 0 46px;" title="Attach a photo">📷</button>
        <input id="imgFile" type="file" accept="image/*" style="display: none;" />
        <input id="msg" type="text" autocomplete="off" autocapitalize="off" placeholder="Type a prompt…" />
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>

<script src="/assets/xterm.js"></script>
<script>
(function () {
  // Token arrives in the URL fragment from the pairing QR, or in ?t= when an
  // installed home-screen app launches via the tokenised manifest start_url.
  // Persisted as a fallback for launches that carry neither.
  var token = location.hash.slice(1)
  if (!token) {
    try { token = new URLSearchParams(location.search).get('t') || '' } catch (e) {}
  }
  if (token) {
    try { localStorage.setItem('claudinator-token', token) } catch (e) {}
  } else {
    try { token = localStorage.getItem('claudinator-token') || '' } catch (e) {}
  }

  // Inject the manifest with the token so "Add to Home Screen" installs a
  // start URL that can authenticate.
  if (token) {
    var mlink = document.createElement('link')
    mlink.rel = 'manifest'
    mlink.href = '/manifest.webmanifest?t=' + encodeURIComponent(token)
    document.head.appendChild(mlink)
  }
  var ws = null
  var state = null
  var term = null
  var curSession = null // { sessionId, cardTitle }
  var reconnectDelay = 1000

  var $ = function (id) { return document.getElementById(id) }

  function api(path) {
    return fetch(path + '?t=' + encodeURIComponent(token)).then(function (r) {
      if (r.status === 401) { showAuthError(); throw new Error('unauthorized') }
      return r.json()
    })
  }

  function showAuthError() {
    $('authErr').style.display = 'block'
    $('board').style.display = 'none'
    $('session').classList.remove('open')
  }

  // Rescue path: paste the pairing link (or bare token) to re-authenticate —
  // needed when an installed app launches with no token and empty storage.
  $('tokenGo').addEventListener('click', function () {
    var v = ($('tokenIn').value || '').trim()
    if (!v) return
    var t = v
    if (v.indexOf('#') !== -1) {
      t = v.slice(v.indexOf('#') + 1)
    } else if (v.indexOf('t=') !== -1) {
      try { t = new URLSearchParams(v.slice(v.indexOf('?'))).get('t') || v } catch (e) {}
    }
    try { localStorage.setItem('claudinator-token', t) } catch (e) {}
    location.href = '/#' + t
    location.reload()
  })

  // ---- Board rendering ----
  function statusLabel(s) {
    if (s === 'decision') return 'needs a decision'
    if (s === 'waiting') return 'waiting for prompt'
    if (s === 'running') return 'working'
    if (s === 'starting') return 'starting'
    return null
  }

  // Collapsed columns are remembered per phone.
  var collapsed = {}
  try { collapsed = JSON.parse(localStorage.getItem('claudinator-collapsed') || '{}') } catch (e) {}
  function toggleColumn(id) {
    collapsed[id] = !collapsed[id]
    try { localStorage.setItem('claudinator-collapsed', JSON.stringify(collapsed)) } catch (e) {}
    renderBoard()
  }

  function renderBoard() {
    if (!state) return
    var cols = $('cols')
    cols.innerHTML = ''
    var any = false
    state.columns.forEach(function (col) {
      if (!col.cards.length) return
      any = true
      var isCollapsed = !!collapsed[col.id]
      var needsDecision = col.cards.some(function (c) { return c.status === 'decision' })
      var h = document.createElement('div')
      h.className = 'colTitle'
      h.innerHTML =
        '<span class="colChev">' + (isCollapsed ? '▶' : '▼') + '</span>' +
        col.title + ' <span class="n">' + col.cards.length + '</span>' +
        (isCollapsed && needsDecision ? '<span class="colAlert"></span>' : '')
      h.addEventListener('click', function () { toggleColumn(col.id) })
      cols.appendChild(h)
      if (isCollapsed) return
      // Decision cards float to the top of their column.
      var sorted = col.cards.slice().sort(function (a, b) {
        var da = a.status === 'decision' ? 0 : 1
        var db = b.status === 'decision' ? 0 : 1
        return da - db
      })
      sorted.forEach(function (card) {
        var el = document.createElement('div')
        el.className = 'card' + (card.sessionId ? ' tappable' : '')
        var meta = []
        var sl = statusLabel(card.status)
        if (sl) meta.push(sl)
        if (card.worktreeBranch) meta.push('⎇ ' + card.worktreeBranch)
        if (card.cost != null) meta.push('$' + card.cost.toFixed(2))
        el.innerHTML =
          '<div class="dot ' + (card.status || '') + '"></div>' +
          '<div class="cardBody">' +
          '  <div class="cardTitle"></div>' +
          '  <div class="cardMeta">' + meta.map(function (m) { return '<span>' + m + '</span>' }).join('') + '</div>' +
          '</div>' +
          (card.sessionId ? '<div class="chev">›</div>' : '')
        el.querySelector('.cardTitle').textContent = card.title
        if (card.sessionId) {
          el.addEventListener('click', function () { openSession(card.sessionId, card.title) })
        }
        cols.appendChild(el)
      })
    })
    if (!any) {
      cols.innerHTML = '<div class="empty">No cards on the board.</div>'
    }
  }

  function refreshState() {
    api('/api/state').then(function (s) { state = s; renderBoard(); updateSessionDot() }).catch(function () {})
  }

  // ---- Session/terminal view ----
  function findCard(sessionId) {
    if (!state) return null
    var found = null
    state.columns.forEach(function (col) {
      col.cards.forEach(function (c) { if (c.sessionId === sessionId) found = c })
    })
    return found
  }

  function updateSessionDot() {
    if (!curSession) return
    var card = findCard(curSession.sessionId)
    $('sessDot').className = 'dot ' + ((card && card.status) || '')
    if (card && card.status === null) $('stoppedNote').classList.add('show')
  }

  // Board scroll offset, saved when the terminal overlay locks the body
  // (body.sessOpen makes it position:fixed, which resets the page scroll).
  var boardScrollY = 0

  function openSession(sessionId, title) {
    curSession = { sessionId: sessionId, cardTitle: title }
    $('sessTitle').textContent = title
    $('stoppedNote').classList.remove('show')
    $('session').classList.add('open')
    boardScrollY = window.scrollY || 0
    document.body.classList.add('sessOpen')
    updateSessionDot()
    if (term) { term.dispose(); term = null }
    sendWs({ type: 'sub', sessionId: sessionId })
  }

  function closeSession() {
    if (curSession) sendWs({ type: 'unsub', sessionId: curSession.sessionId })
    curSession = null
    $('session').classList.remove('open')
    document.body.classList.remove('sessOpen')
    window.scrollTo(0, boardScrollY)
    if (term) { term.dispose(); term = null }
    refreshState()
  }

  var ptyRows = 30 // the desktop PTY's real grid height, from the buffer msg
  function initTerm(cols, rows) {
    if (term) term.dispose()
    ptyRows = rows
    term = new Terminal({
      cols: cols, rows: rows,
      fontSize: 11,
      fontFamily: 'Menlo, Consolas, monospace',
      scrollback: 5000,
      disableStdin: true,
      theme: { background: '#0d1117', foreground: '#e6edf3' }
    })
    term.open($('term'))
    // Input is disabled, but xterm's hidden helper textarea still takes focus
    // on touch — which pops the iOS keyboard for nothing. inputmode=none
    // keeps focus behavior intact without summoning the keyboard.
    var ta = term.element.querySelector('.xterm-helper-textarea')
    if (ta) { ta.setAttribute('inputmode', 'none'); ta.setAttribute('readonly', 'readonly') }
    applyFit()
    // Second pass after layout settles — metrics aren't perfectly linear
    // across font sizes, so refine once against the re-measured width.
    requestAnimationFrame(function () { applyFit() })
  }

  // Fit-to-width: shrink the terminal's actual font size until the desktop's
  // full column grid fits the phone screen. Scaling the real font (instead of
  // CSS zoom/transform) keeps glyphs proportional — iOS WebKit renders zoomed
  // text squashed. Floored at 5px: a very wide desktop terminal pans slightly
  // rather than becoming unreadable. Toggling 1:1 restores full size.
  var FULL_FONT = 11
  var MIN_FONT = 5
  var fitMode = true
  function applyFit() {
    if (!term || !term.element) return
    var target = FULL_FONT
    if (fitMode) {
      var screen = term.element.querySelector('.xterm-screen')
      var w = screen ? screen.offsetWidth : 0
      var avail = $('termWrap').clientWidth - 8
      if (w > 0 && avail < w) {
        var current = term.options.fontSize || FULL_FONT
        target = Math.max(MIN_FONT, Math.min(FULL_FONT, (current * avail) / w))
      }
    }
    if (Math.abs((term.options.fontSize || FULL_FONT) - target) > 0.05) {
      term.options.fontSize = target
    }
    $('fitBtn').textContent = fitMode ? '1:1' : 'Fit'
    fillRows()
    term.scrollToBottom()
  }

  // Fill the screen height: at fit-mode font sizes the desktop's grid is only
  // a few hundred pixels tall, stranding scrolled text in the top half of the
  // phone screen. This terminal is display-only (never resizes the PTY), so
  // it can carry extra rows beyond the desktop grid — the viewport then shows
  // that much more scrollback, all the way down to the input bar. Capped so
  // the DOM renderer stays smooth on tall screens.
  function fillRows() {
    if (!term || !term.element) return
    var screen = term.element.querySelector('.xterm-screen')
    if (!screen || !term.rows) return
    var cell = screen.offsetHeight / term.rows
    if (!(cell > 0)) return
    var want = Math.max(ptyRows, Math.min(150, Math.floor(($('termWrap').clientHeight - 8) / cell)))
    if (want !== term.rows) {
      term.resize(term.cols, want)
      term.scrollToBottom()
    }
  }
  $('fitBtn').addEventListener('click', function () { fitMode = !fitMode; applyFit() })
  window.addEventListener('resize', function () { if (term) applyFit() })

  // In fit mode the rendered grid is only a few hundred pixels tall, so most
  // of the screen below it is dead space xterm never sees — swipes there did
  // nothing (or scrolled the board behind the overlay). Forward vertical
  // drags on that dead space into terminal scrolling; touches on the
  // terminal itself are left to xterm's own handlers. Mostly-horizontal
  // gestures are released so 1:1 mode can still pan sideways natively.
  ;(function () {
    var startY = null
    var startX = null
    var wrap = $('termWrap')
    wrap.addEventListener('touchstart', function (e) {
      if (!term || !term.element || term.element.contains(e.target)) { startY = null; return }
      startY = e.touches[0].pageY
      startX = e.touches[0].pageX
    }, { passive: true })
    wrap.addEventListener('touchmove', function (e) {
      if (startY == null || !term || !term.element) return
      var y = e.touches[0].pageY
      var x = e.touches[0].pageX
      if (Math.abs(x - startX) > Math.abs(y - startY) + 8) { startY = null; return }
      var screen = term.element.querySelector('.xterm-screen')
      var cell = screen && term.rows ? screen.offsetHeight / term.rows : 10
      var lines = Math.trunc((startY - y) / cell)
      if (lines !== 0) {
        term.scrollLines(lines)
        startY = y
      }
      e.preventDefault()
    }, { passive: false })
    wrap.addEventListener('touchend', function () { startY = null }, { passive: true })
  })()

  // Copy view: snapshot the terminal buffer as plain text (soft-wrapped rows
  // joined back into their logical lines) so iOS native selection can copy it.
  $('copyBtn').addEventListener('click', function () {
    if (!term) return
    var b = term.buffer.active
    var lines = []
    var start = Math.max(0, b.length - 2000)
    for (var i = start; i < b.length; i++) {
      var line = b.getLine(i)
      var s = line ? line.translateToString(true) : ''
      if (line && line.isWrapped && lines.length) lines[lines.length - 1] += s
      else lines.push(s)
    }
    while (lines.length && !lines[lines.length - 1]) lines.pop()
    $('copyText').textContent = lines.join('\n')
    $('copyView').classList.add('open')
    var ct = $('copyText')
    ct.scrollTop = ct.scrollHeight
  })
  $('copyDone').addEventListener('click', function () {
    $('copyView').classList.remove('open')
    $('copyText').textContent = ''
  })

  // True when the terminal viewport is at (or within a row of) the bottom, i.e.
  // the user hasn't scrolled up into the scrollback.
  function atBottom() {
    if (!term) return true
    var b = term.buffer.active
    return b.viewportY >= b.baseY - 1
  }

  // ---- WebSocket ----
  function sendWs(obj) {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj))
  }

  function connect() {
    var proto = location.protocol === 'https:' ? 'wss://' : 'ws://'
    ws = new WebSocket(proto + location.host + '/ws?t=' + encodeURIComponent(token))

    ws.onopen = function () {
      $('conn').className = 'conn ok'
      reconnectDelay = 1000
      refreshState()
      // Re-attach to the open session after a reconnect.
      if (curSession) sendWs({ type: 'sub', sessionId: curSession.sessionId })
    }

    ws.onmessage = function (ev) {
      var msg
      try { msg = JSON.parse(ev.data) } catch (e) { return }

      if (msg.type === 'board') {
        refreshState()
        return
      }

      if (msg.type === 'status') {
        // Update in place; cards appearing/disappearing come via refresh.
        var known = false
        if (state) state.columns.forEach(function (col) {
          col.cards.forEach(function (c) {
            if (c.sessionId === msg.sessionId) { c.status = msg.status; known = true }
          })
        })
        if (known) { renderBoard(); updateSessionDot() } else { refreshState() }
        if (curSession && msg.sessionId === curSession.sessionId && msg.status === 'stopped') {
          $('stoppedNote').classList.add('show')
        }
        return
      }

      if (msg.type === 'buffer' && curSession && msg.sessionId === curSession.sessionId) {
        initTerm(msg.cols, msg.rows)
        term.write(msg.data, function () {
          term.scrollToBottom()
        })
        return
      }

      if (msg.type === 'data' && term && curSession && msg.sessionId === curSession.sessionId) {
        // Only stay pinned to the bottom if you're already there — otherwise
        // streaming output would yank you back down every time you scroll up
        // to read the scrollback while a session is working.
        var stick = atBottom()
        term.write(msg.data, function () { if (stick) term.scrollToBottom() })
        return
      }
    }

    ws.onclose = function () {
      $('conn').className = 'conn'
      ws = null
      setTimeout(connect, reconnectDelay)
      reconnectDelay = Math.min(reconnectDelay * 2, 15000)
    }

    ws.onerror = function () { try { ws.close() } catch (e) {} }
  }

  // ---- Input ----
  function write(data) {
    if (curSession) sendWs({ type: 'write', sessionId: curSession.sessionId, data: data })
  }

  document.querySelectorAll('.qk').forEach(function (btn) {
    btn.addEventListener('click', function () { write(btn.dataset.k) })
  })

  // Backspace repeats while held, so text sitting in the CLI's input box
  // (typed but never submitted) can be wiped without fifty taps. touchstart
  // preventDefault suppresses the synthetic click, so touch devices don't
  // double-delete; desktop browsers still get the plain click above.
  ;(function () {
    var bs = $('bsBtn')
    var timer = null
    function stop() { if (timer) { clearTimeout(timer); timer = null } }
    bs.addEventListener('touchstart', function (e) {
      e.preventDefault()
      write('\x7f')
      timer = setTimeout(function tick() {
        write('\x7f')
        timer = setTimeout(tick, 60)
      }, 400)
    }, { passive: false })
    bs.addEventListener('touchend', stop)
    bs.addEventListener('touchcancel', stop)
  })()

  function sendPrompt() {
    var input = $('msg')
    if (!input.value) return
    write(input.value)
    // Enter goes as a separate keystroke a beat later: a text burst ending in
    // \r reads as one paste to the CLI, which then leaves the whole prompt
    // sitting in its input box instead of submitting it.
    setTimeout(function () { write('\r') }, 150)
    input.value = ''
  }
  $('sendBtn').addEventListener('click', sendPrompt)
  $('msg').addEventListener('keydown', function (e) { if (e.key === 'Enter') sendPrompt() })
  $('backBtn').addEventListener('click', closeSession)

  // Photo attach: upload to the PC, which types the saved file's path into
  // the CLI input (like drag-dropping a file onto the terminal).
  $('imgBtn').addEventListener('click', function () { $('imgFile').click() })
  $('imgFile').addEventListener('change', function () {
    var file = $('imgFile').files[0]
    $('imgFile').value = ''
    if (!file || !curSession) return
    var btn = $('imgBtn')
    btn.textContent = '…'
    fetch('/api/upload?t=' + encodeURIComponent(token) +
          '&sessionId=' + encodeURIComponent(curSession.sessionId) +
          '&name=' + encodeURIComponent(file.name || 'photo.jpg'),
      { method: 'POST', body: file })
      .then(function (r) {
        btn.textContent = r.ok ? '✓' : '✗'
        setTimeout(function () { btn.textContent = '📷' }, 1500)
      })
      .catch(function () {
        btn.textContent = '✗'
        setTimeout(function () { btn.textContent = '📷' }, 1500)
      })
  })

  // Refresh the board when the phone comes back to the foreground.
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) refreshState()
  })

  if (!token) { showAuthError(); return }
  refreshState()
  connect()
  // Cheap safety net: costs and board structure drift without events.
  setInterval(function () { if (!document.hidden && !curSession) refreshState() }, 30000)
})()
</script>
</body>
</html>
