appId: com.claude-orchestrator.app
productName: Claude Code Orchestrator
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.*"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - "node_modules/node-pty/**"
# Lists the app in Windows' "Open with" menu for markdown files; opening one
# launches straight into the preview window (viewer mode), no board.
fileAssociations:
  - ext:
      - md
      - markdown
    name: Markdown Document
    role: Viewer
win:
  executableName: claude-orchestrator
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
publish:
  - provider: github
    owner: marcobornman
    repo: Claudinator
    releaseType: release
